*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;letter-spacing:-0.01em}
main{max-width:500px;margin:0 auto;padding:36px 20px 60px}

h1{font-size:2.4rem;font-weight:800;line-height:1.05;margin:0.2rem 0;letter-spacing:-.03em}
h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:0.98rem;margin:0 0 28px;font-weight:400}

.drop{display:block;border:2px dashed var(--line);border-radius:24px;background:var(--card);padding:40px 20px;text-align:center;cursor:pointer;transition:all .25s cubic-bezier(0.16, 1, 0.3, 1);box-shadow:0 8px 30px rgba(0,0,0,0.02)}
.drop:hover,.drop.on{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 40px var(--glow)}
.drop b{display:block;font-size:1.15rem;font-weight:700;margin-bottom:4px}.drop small{color:var(--muted);font-size:0.88rem}
input[type=file]{display:none}

#prev{display:none;width:100%;max-height:360px;object-fit:cover;border-radius:24px;margin-bottom:16px;box-shadow:0 12px 36px rgba(0,0,0,0.15)}

.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px;margin-top:16px;box-shadow:0 16px 48px rgba(0,0,0,0.04);animation:fadeIn .4s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.tag{display:inline-block;font-size:.75rem;padding:4px 12px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.vibe{font-size:1.5rem;font-weight:800;margin:10px 0 2px;letter-spacing:-.02em}
.cap{color:var(--muted);margin:0 0 18px;font-size:0.95rem}

.song{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
