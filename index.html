  const d=x.getImageData(0,0,N,N).data,n=N*N,L=new Float32Array(n),cl=v=>Math.max(0,Math.min(1,v));
  let R=0,B=0,S=0,dark=0,bw=0,or=0,bl=0,gr=0,ne=0,ct=0,cn=0,sum=0;
  for(let i=0;i<n;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0,l=(.299*r+.587*g+.114*b)/255,px=i%N,py=(i/N)|0;
    L[i]=l;sum+=l;R+=r;B+=b;S+=sat;if(l<.2)dark++;if(sat<.08)bw++;
    if(r>g&&g>b&&sat>.35&&l>.35)or++;if(b>r+15&&b>g)bl++;if(g>r+5&&g>b+5)gr++;if(sat>.55&&l>.4)ne++;
    if(px>16&&px<48&&py>16&&py<48){ct+=l;cn++}
  }
  const lum=sum/n,sat=S/n,con=Math.sqrt(L.reduce((a,v)=>a+(v-lum)**2,0)/n),warm=(R-B)/n/255;
  let ed=0;for(let i=0;i<n-N-1;i++)ed+=Math.abs(L[i]-L[i+1])+Math.abs(L[i]-L[i+N]);ed/=2*n;
  const bm=(sum-ct)/(n-cn),flash=cl((ct/cn-bm)*4)*(lum<.5?1:.3),neon=lum<.45?cl(ne/n*4):0,dk=dark/n,soft=cl(1-con*2.5);
  return{lum,sat,con,flash,neon,
    E:cl(.5*con*3+.25*sat*1.5+.25*ed*6),
    M:cl(.45*lum+.3*sat+.3*cl(or/n*3)+.1*(1-dk)),
    N:cl(1.25-1.6*lum+.25*neon+.2*dk),
    R:cl(.5*soft+.5*Math.max(0,warm*3)),
    orange:cl(or/n*3),blue:cl(bl/n*2.5),green:cl(gr/n*3),bw:bw/n>.8?1:0,busy:cl(ed*6)};
}
function palette(img){
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(img,0,0,48,48);
  const d=x.getImageData(0,0,48,48).data,m={};
  for(let i=0;i<d.length;i+=4){const k=((d[i]>>5)<<6)|((d[i+1]>>5)<<3)|(d[i+2]>>5),o=m[k]||(m[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2]}
  const a=Object.values(m).map(o=>({n:o.n,c:[o.r/o.n,o.g/o.n,o.b/o.n].map(Math.round)})).sort((p,q)=>q.n-p.n),out=[];
  for(const o of a){if(out.every(p=>Math.hypot(p[0]-o.c[0],p[1]-o.c[1],p[2]-o.c[2])>70))out.push(o.c);if(out.length===5)break}
  return out;
}

const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',GS='https://storage.googleapis.com/mediapipe-models/';
let vis=null;
function mp(){
  if(!vis)vis=(async()=>{
    const m=await import(MP+'/vision_bundle.mjs'),fs=await m.FilesetResolver.forVisionTasks(MP+'/wasm');
    const mk=(C,p,o)=>C.createFromOptions(fs,{baseOptions:{modelAssetPath:GS+p},runningMode:'IMAGE',...o});
    return{m,mk,obj:await mk(m.ObjectDetector,'object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite',{scoreThreshold:.4,maxResults:20})};
  })().catch(()=>null);
  return vis;
}
async function detect(img){
  const V=await Promise.race([mp(),new Promise(r=>setTimeout(()=>r(null),40000))]);if(!V)return null;
  try{
    const W=img.naturalWidth,H=img.naturalHeight,ds=V.obj.detect(img).detections,nm=d=>d.categories[0].categoryName;
    const p=ds.filter(d=>nm(d)==='person').map(d=>({h:d.boundingBox.height/H,w:d.boundingBox.width/W})).sort((x,y)=>y.h*y.w-x.h*x.w);
    const c={persons:p.length,big:p[0]?p[0].h:0,objs:[...new Set(ds.map(nm).filter(n=>n!=='person'))],gest:[],face:null,arms:false};
    if(c.persons){
      // faces, hands and pose load only when a person is in the photo; each is optional
      await Promise.all([
        (async()=>{V.face=V.face||await V.mk(V.m.FaceLandmarker,'face_landmarker/face_landmarker/float16/1/face_landmarker.task',{outputFaceBlendshapes:true,numFaces:3});
          const b=(V.face.detect(img).faceBlendshapes[0]||{categories:[]}).categories,g=n=>(b.find(x=>x.categoryName===n)||{score:0}).score;
          if(b.length)c.face={smile:(g('mouthSmileLeft')+g('mouthSmileRight'))/2,smirk:Math.abs(g('mouthSmileLeft')-g('mouthSmileRight')),frown:(g('mouthFrownLeft')+g('mouthFrownRight'))/2,sad:g('browInnerUp'),closed:(g('eyeBlinkLeft')+g('eyeBlinkRight'))/2}})().catch(()=>{}),
        (async()=>{V.hands=V.hands||await V.mk(V.m.GestureRecognizer,'gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',{numHands:2});
          c.gest=[...new Set(V.hands.recognize(img).gestures.flat().map(x=>x.categoryName).filter(n=>n!=='None'))]})().catch(()=>{}),
        (async()=>{V.pose=V.pose||await V.mk(V.m.PoseLandmarker,'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task');
          const l=V.pose.detect(img).landmarks[0];if(l)c.arms=[[15,11],[16,12]].some(([w,s])=>l[w].visibility>.5&&l[w].y<l[s].y)})().catch(()=>{})
      ]);
    }
    return c;
  }catch(e){return null}
}

function cueScore(m){
  const c=st.cues;if(!c)return 0;const f=c.face||{},id=m.id,has=l=>l.includes(id);let s=0;
  c.objs.forEach(o=>{if((CUE[o]||[]).includes(id))s+=.3});s=Math.min(s,.6);
  if(f.smile>.5&&has(['company','love','achieve','grateful','festival','glow']))s+=.5;
  if(c.persons>=2&&f.smile>.5&&has(['company','festival']))s+=.3;
  if((f.frown>.3||(f.sad>.4&&f.smile<.2))&&has(['regret','deep','remember','miss','social']))s+=.5;
  if(f.smirk>.25&&has(['irony']))s+=.7;
  if(c.persons&&f.smile<.15&&f.frown<.15&&has(['deep','contemplate','aesself','irony']))s+=.3;
  if(f.closed>.6&&has(['peace','contemplate','grateful']))s+=.4;
  c.gest.forEach(g=>{if((GEST[g]||[]).includes(id))s+=.5});
  if(c.arms&&has(['achieve','festival','newplace','glow']))s+=.5;
  if(!c.persons&&!c.objs.length&&has(['scenery','aesplace','newplace','peace']))s+=.5;
  if(c.persons&&c.big>.5&&has(['aesself','glow']))s+=.3;
  if(c.persons>=4&&has(['social','festival','company']))s+=.3;
  return s;
}
function seenText(){
  const c=st.cues;if(!c)return '';const f=c.face||{};
  const l=(c.persons?[c.persons===1?'one person':c.persons===2?'two people':c.persons+' people']:[])
    .concat(f.smirk>.25?['a smirk']:f.smile>.5?['a smile']:f.frown>.3?['a frown']:[],c.arms?['arms up']:[],c.gest.map(g=>g.replace('_',' ').toLowerCase()),c.objs.slice(0,3));
  return l.length?' I can see '+l.join(', ')+'.':'';
}

function baseScore(m,f){return -.6*(Math.abs(f.E-m.a[0])+1.2*Math.abs(f.M-m.a[2]))+cueScore(m)}
function ranked(){
  return st.cands.map(c=>{let sc=c.base;for(const k in st.qa.axes)sc-=1.6*Math.abs(c.m.a[AXI[k]]-st.qa.axes[k]);return{m:c.m,s:sc}}).sort((x,y)=>y.s-x.s);
}
function nextQ(){
  const a=st.qa,done=Object.keys(a.axes).length;if(a.n>=5)return null;
  if(done<3){
    const r=ranked();
    if(!(done>=1&&r[0].s-r[1].s>.5)){
      let best=null,bs=.25;
      for(const k of ['e','s','m','i','f']){if(k in a.axes)continue;const v=st.cands.map(c=>c.m.a[AXI[k]]),sp=Math.max(...v)-Math.min(...v);if(sp>bs){bs=sp;best=k}}

const VIBE={};Object.entries(VB).forEach(([k,v])=>{VIBE[k]=v.split('\n').map(l=>l.split('~'))});
function vibeSongs(){
  const L=$('lang').value,a=(st.mood&&VIBE[st.mood.id])||[],code={hindi:'h',punjabi:'p'}[L];
  if(L&&L!=='english'&&!code)return [];
  return shuffle(a.filter(x=>!L?true:L==='english'?!x[2]:x[2]===code)).map(x=>({title:x[0],artist:x[1]}));

// ---- the crate ----
function row(s,ul,x){
  const li=document.createElement('li'),b=document.createElement('button'),t=document.createElement('span'),a=document.createElement('span');
  b.className='go';t.className='t';t.textContent=s.title;a.className='a';a.textContent=s.artist;b.append(t,a);
  if(same(s,st.cur))b.setAttribute('aria-current','true');
  b.onclick=()=>play(s);li.appendChild(b);
  if(x){const r=document.createElement('button');r.className='x';r.textContent='Remove';r.setAttribute('aria-label','Remove from stash');r.onclick=()=>{ls.set('larp_stash',ls.get('larp_stash',[]).filter(o=>!same(o,s)));drawStash();heart()};li.appendChild(r)}
  ul.appendChild(li);
}
function drawList(msg){
  if(msg===undefined)msg=st.note;
  const ul=$('list');ul.innerHTML='';
  if(msg){const m=document.createElement('li');m.className='empty';m.textContent=msg;ul.appendChild(m)}

function drawStash(){
  const a=ls.get('larp_stash',[]);$('stashw').hidden=!a.length;const ul=$('stash');ul.innerHTML='';a.forEach(s=>row(s,ul,true));
}
async function dig(){
  st.songs=[];drawList('Digging…');
  let songs=[],msg='';
  if(ON){
    try{const d=await(await fetch(API+'/songs?vibe='+st.vibe+'&tags='+encodeURIComponent((st.mood?st.mood.t:[]).join(','))+'&depth='+st.depth+'&lang='+encodeURIComponent($('lang').value))).json();songs=d.songs||[];if(d.error)msg=d.error}
    catch(e){msg='Couldn’t reach the song service.'}
  }
  const pre=vibeSongs().slice(0,18).concat(curated().slice(0,10)),seen=new Set(pre.map(x=>x.title+x.artist));
  if(pre.length)songs=pre.concat(songs.filter(x=>!seen.has(x.title+x.artist)));
  if(!songs.length){songs=(SEED[st.vibe]||SEED.moody).map(s=>{const p=s.split('~');return{title:p[0],artist:p[1]}});
    msg=ON?'Showing a starter crate instead. '+msg:'Showing a starter crate. Connect the song service for endless digging.'}
  st.songs=songs;st.note=msg;drawList();
}

// ---- cover art ----
function jsonp(u){return new Promise((ok,no)=>{const f='cb'+Date.now()+Math.floor(Math.random()*1e4),el=document.createElement('script'),t=setTimeout(()=>{cl();no(new Error('timed out'))},7000);
  function cl(){clearTimeout(t);delete window[f];el.remove()}
  window[f]=d=>{cl();ok(d)};el.onerror=()=>{cl();no(new Error('blocked'))};el.src=u+'&callback='+f;document.head.appendChild(el)})}
function setArt(u){
  st.art=u||'';st.artImg=null;const a=$('art'),b=$('sart'),d=document.querySelector('#sticker .disc');
  a.hidden=b.hidden=!u;d.style.display=u?'none':'';
  if(u){a.src=b.src=u;const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{st.artImg=im};im.src=u}
}
async function findArt(s,id){
  setArt(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'');
  try{
    const d=await jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=3&term='+encodeURIComponent(s.artist+' '+s.title));
    const n=v=>(v||'').toLowerCase(),a=n(s.artist).slice(0,6);
    const r=(d.results||[]).find(o=>n(o.artistName).includes(a)||(a&&n(s.artist).includes(n(o.artistName).slice(0,6))));
    if(r&&r.artworkUrl100&&st.cur===s)setArt(r.artworkUrl100.replace(/\d+x\d+bb/,'400x400bb'));
  }catch(e){}
}

// ---- playing a song and choosing the clip ----
const vc=ls.get('larp_vc',{});
function loadYT(){return new Promise((ok,no)=>{if(window.YT&&YT.Player)return ok();const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>no(new Error('YouTube is blocked on this network'));window.onYouTubeIframeAPIReady=ok;document.head.appendChild(s);setTimeout(()=>no(new Error('YouTube timed out')),8000)})}
function fallback(s,why){
  const m=$('msg');m.textContent=why+' ';const a=document.createElement('a'),q=encodeURIComponent(s.artist+' '+s.title);
  a.href='https://www.youtube.com/results?search_query='+q;a.target='_blank';a.rel='noopener';a.textContent='Open on YouTube';m.appendChild(a);
}
function sticker(){
  const s=st.cur;if(!s)return;$('stt').textContent=s.title;
  $('sta').textContent=s.artist+(st.dur?'  '+F(st.t0)+' to '+F(st.t0+st.win):'');$('sticker').style.display=st.img?'flex':'none';
}
async function play(s){
  st.cur=s;st.dur=0;st.fixed=false;document.body.classList.remove('playing');setArt('');$('pp').disabled=true;$('pp').textContent='Pause';
  $('dock').classList.add('on');$('frame').classList.add('pl');$('pt').textContent=s.title;$('pa').textContent=s.artist;$('rg').disabled=true;$('rc').textContent='';$('re').textContent='';
  $('msg').textContent=ON?'Loading…':'';sticker();heart();drawList();drawStash();
  if(matchMedia('(max-width:879px)').matches)$('frame').scrollIntoView({behavior:'smooth',block:'start'});
  if(!ON){findArt(s,null);fallback(s,'Playback needs the song service.');return}
  try{
    const k=s.artist+'|'+s.title;let id=vc[k];
    if(!id){const d=await(await fetch(API+'/resolve?title='+encodeURIComponent(s.title)+'&artist='+encodeURIComponent(s.artist))).json();id=d.videoId;
      if(id){vc[k]=id;ls.set('larp_vc',vc)}else if(d.error)throw new Error(/quota/i.test(d.error)?'Today’s song lookups are used up.':d.error)}
    if(!id)throw new Error('No playable copy found.');
    if(st.cur!==s)return;
    findArt(s,id);
    await loadYT();
    if(st.yp&&st.yp.loadVideoById)st.yp.loadVideoById({videoId:id,startSeconds:0});
    else st.yp=new YT.Player('ytp',{width:'200',height:'200',videoId:id,playerVars:{playsinline:1},events:{onReady:e=>e.target.playVideo(),onStateChange:e=>{document.body.classList.toggle('playing',e.data===1);if(e.data===1||e.data===2){$('pp').disabled=false;$('pp').textContent=e.data===1?'Pause':'Play'}if(e.data===1)ready()}}});
    clearInterval(st.tk);st.tk=setInterval(()=>{try{if(st.dur&&st.yp.getCurrentTime()>=st.t0+st.win)st.yp.seekTo(st.t0,true)}catch(e){}},300);
    $('msg').textContent='';
  }catch(e){fallback(s,(e.message||e)+'')}
}
function ready(){
  if(st.fixed||!st.yp.getDuration)return;const d=Math.round(st.yp.getDuration());if(d<20)return;
  st.fixed=true;st.dur=d;$('rg').disabled=false;$('re').textContent=F(d);
  const saved=ls.get('larp_stash',[]).find(o=>same(o,st.cur));
  clip(saved&&saved.t0!=null?saved.t0:Math.round(d*.3),true);
}
function clip(t,go){
  if(!st.dur)return;st.t0=Math.max(0,Math.min(t,st.dur-st.win));
  $('rg').max=st.dur-st.win;$('rg').value=st.t0;$('rc').textContent=F(st.t0)+' to '+F(st.t0+st.win);
  tabs($('lens'),[5,10,15].map(n=>[n,n+' sec']),st.win,n=>{st.win=+n;clip(st.t0,true)});
  sticker();
  const a=ls.get('larp_stash',[]),m=a.find(o=>same(o,st.cur));if(m){m.t0=st.t0;ls.set('larp_stash',a)}
  if(go){clearTimeout(st.db);st.db=setTimeout(()=>{try{st.yp.seekTo(st.t0,true);st.yp.playVideo()}catch(e){}},160)}
}
$('rg').oninput=e=>clip(+e.target.value,true);
function heart(){const on=ls.get('larp_stash',[]).some(o=>same(o,st.cur));$('heart').textContent=on?'Stashed':'Stash';$('heart').setAttribute('aria-pressed',on)}
$('heart').onclick=()=>{
  if(!st.cur)return;let a=ls.get('larp_stash',[]);
  a=a.some(o=>same(o,st.cur))?a.filter(o=>!same(o,st.cur)):[{title:st.cur.title,artist:st.cur.artist,t0:st.dur?st.t0:null},...a].slice(0,40);
  ls.set('larp_stash',a);heart();drawStash();
};
function step(d){const L=st.songs;if(!L.length)return;let i=L.findIndex(s=>same(s,st.cur));i=i<0?0:(i+d+L.length)%L.length;play(L[i])}
$('next').onclick=()=>step(1);
$('pp').onclick=()=>{const y=st.yp;if(!y||!y.getPlayerState)return;y.getPlayerState()===1?y.pauseVideo():y.playVideo()};
document.addEventListener('keydown',e=>{if(e.key===' '&&e.target===document.body&&!$('pp').disabled){e.preventDefault();$('pp').click();return}if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

// ---- photo in ----
function handle(f){
  if(!f||!f.type.startsWith('image/'))return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    st.img=im;$('photo').src=url;$('frame').classList.add('on');$('hint').classList.add('on');$('sv').disabled=false;
    drawPal(palette(im));st.feat=scan(im);st.cues=null;lookQuiz(im);sticker();
  };

$('chg').onclick=()=>$('file').click();

$('lang').onchange=()=>{if(st.img&&st.mood){newQuote();dig()}};

function wrap(x,t,w){const o=[];let l='';t.split(' ').forEach(wd=>{const n=l?l+' '+wd:wd;if(x.measureText(n).width>w&&l){o.push(l);l=wd}else l=n});o.push(l);return o}
async function save(){

  const g=x.createLinearGradient(0,900,0,1920);g.addColorStop(0,'rgba(10,14,40,0)');g.addColorStop(1,'rgba(10,14,40,.9)');x.fillStyle=g;x.fillRect(0,900,1080,1020);
  const p=st.q.split('|');x.fillStyle='#fff';x.font='italic 400 68px Newsreader, Georgia, serif';x.textBaseline='alphabetic';
  const L=wrap(x,'“'+p[0]+'”',900),y0=1790-L.length*86;L.forEach((l,i)=>x.fillText(l,90,y0+i*86));
  x.fillStyle=acc;x.font='600 34px Archivo, sans-serif';x.fillText(p[1],90,1850);
  const s=st.cur;
  if(s){const h=st.dur?170:140,A=st.artImg&&st.artImg.naturalWidth?st.artImg:null,tx=A?h+24:28;
    x.save();x.translate(70,150);x.rotate(-.05);x.fillStyle=acc;x.fillRect(0,0,740,h);
    if(A){const k=Math.min(A.naturalWidth,A.naturalHeight);x.drawImage(A,(A.naturalWidth-k)/2,(A.naturalHeight-k)/2,k,k,0,0,h,h)}
    x.fillStyle=ink;x.font='800 46px Archivo, sans-serif';x.fillText(s.title.slice(0,A?24:30),tx,62);x.font='400 32px Archivo, sans-serif';
    x.fillText(s.artist.slice(0,A?28:36),tx,110);if(st.dur){x.font='600 30px Archivo, sans-serif';x.fillText(F(st.t0)+' to '+F(st.t0+st.win),tx,152)}x.restore()}
  c.toBlob(b=>{const u=URL.createObjectURL(b);$('out').src=u;$('out').style.display='block';const a=document.createElement('a');a.href=u;a.download='larp-my-vibe.png';a.click()},'image/png');
}
$('sv').onclick=save;
