<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>larp my vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Newsreader:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B2A6B;--bg2:#22348A;--paper:#EEF1F8;--sun:#FFC83D;--ink:#0E1535;--mute:#A9B4E0;--line:rgba(238,241,248,.22);--acc:#FFC83D;--acc-ink:#0E1535}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font:400 16px/1.5 "Archivo",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.cond{font-stretch:62%;font-variation-settings:"wdth" 62;font-weight:900;letter-spacing:-.005em}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px clamp(16px,4vw,48px) 0;max-width:1180px;margin:0 auto}
.mark{font-size:clamp(2.4rem,7vw,4rem);line-height:.85;margin:0}
.tagline{margin:0;color:var(--mute)}
main{display:grid;gap:40px;padding:30px clamp(16px,4vw,48px) 80px;max-width:1180px;margin:0 auto}
@media(min-width:880px){main{grid-template-columns:minmax(300px,400px) 1fr;gap:64px;align-items:start}#stage{position:sticky;top:20px}}
.frame{position:relative;width:min(100%,400px);aspect-ratio:9/16;background:var(--paper);color:var(--ink);box-shadow:10px 10px 0 var(--acc);overflow:hidden;margin-bottom:18px;transition:box-shadow .25s}
.frame.on{cursor:pointer}
.drop{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:24px;cursor:pointer}
.drop .big{font-size:clamp(3.6rem,13vw,5rem);line-height:.86}
.drop .sm{font-size:.95rem;max-width:24ch}
.frame.on .drop{display:none}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.frame.on #photo,.frame.on .shade{display:block}
.shade{display:none;position:absolute;inset:0;background:linear-gradient(to top,rgba(10,14,40,.88) 0%,rgba(10,14,40,.5) 32%,rgba(10,14,40,0) 58%)}
#quote{position:absolute;left:22px;right:22px;bottom:22px;margin:0;color:#fff;display:none}
.frame.on #quote{display:block}
#quote p{margin:0 0 10px;font:italic 400 1.5rem/1.22 "Newsreader",Georgia,serif}
#quote cite{font-style:normal;font-size:.82rem;color:var(--acc);font-weight:600;filter:brightness(1.25)}
#quote.f{animation:swap .28s ease-out}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#sticker{position:absolute;left:16px;top:20px;background:var(--acc);color:var(--acc-ink);padding:9px 14px 9px 10px;transform:rotate(-3deg);max-width:82%;display:none;align-items:center;gap:10px;transition:background .25s}
#sticker b{display:block;font-weight:800;line-height:1.15}
#sticker span{font-size:.82rem}
.disc{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,var(--acc) 0 12%,var(--acc-ink) 13% 22%,transparent 23%),repeating-radial-gradient(circle,var(--acc-ink) 0 2px,transparent 2px 5px);border:2px solid var(--acc-ink)}
body.playing .disc{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pal{display:none;gap:8px;margin-bottom:16px}
.pal.on{display:flex}
.pal button{width:36px;height:36px;border:2px solid var(--paper);padding:0;cursor:pointer;animation:pop .35s both}
.pal button[aria-pressed=true]{outline:3px solid var(--paper);outline-offset:2px}
.pal button:nth-child(2){animation-delay:.06s}.pal button:nth-child(3){animation-delay:.12s}.pal button:nth-child(4){animation-delay:.18s}.pal button:nth-child(5){animation-delay:.24s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:2px solid var(--paper);background:none;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.hint{margin:12px 0 0;color:var(--mute);font-size:.9rem;display:none}
.hint.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:baseline;margin-bottom:12px}
.lab{color:var(--mute);font-size:.9rem;min-width:5.5rem}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:4px 0;cursor:pointer;font-weight:600}
.tab[aria-pressed=true]{border-bottom-color:var(--sun)}
select{background:var(--bg2);border:2px solid var(--line);padding:6px 10px}
#dock{display:none;grid-template-columns:1fr;gap:20px;margin:22px 0 8px;padding:16px;background:var(--bg2);border-left:6px solid var(--sun);position:relative;z-index:3}
#dock.on{display:grid}
@media(min-width:880px){#dock{position:sticky;top:12px}}
.pw{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
.inf{min-width:0;display:flex;flex-direction:column;justify-content:center}
.inf h3{margin:0;font-size:1.7rem;line-height:.95;overflow-wrap:anywhere}
.by{font:italic 400 1.05rem "Newsreader",Georgia,serif;color:var(--mute);margin:2px 0 10px}
input[type=range]{width:100%;height:34px;background:none;-webkit-appearance:none;appearance:none;margin:4px 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--line)}
input[type=range]::-moz-range-track{height:6px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;background:var(--sun);border:3px solid var(--ink);border-radius:50%}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--sun);border:3px solid var(--ink);border-radius:50%}
input[type=range]:disabled{opacity:.4}
.rt{display:flex;justify-content:space-between;color:var(--mute);font-size:.88rem}
.rt b{color:var(--paper)}
.rowb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.rowb .tab{font-size:.9rem}
.msg{margin:10px 0 0;color:var(--mute);font-size:.88rem}
.msg a{color:var(--sun)}
.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px}
h2{margin:0;font-size:clamp(1.8rem,4vw,2.4rem);line-height:.9}
ul.songs{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
ul.songs li{display:flex;border-bottom:1px solid var(--line)}
ul.songs .go{flex:1;display:flex;justify-content:space-between;gap:14px;text-align:left;background:none;border:0;padding:11px 6px;cursor:pointer;min-width:0}
ul.songs .go[aria-current=true]{background:var(--sun);color:var(--ink)}
ul.songs .t{font-weight:700;overflow-wrap:anywhere}
ul.songs .a{font:italic 400 1rem "Newsreader",Georgia,serif;opacity:.85;text-align:right}
ul.songs .x{background:none;border:0;padding:0 12px;cursor:pointer;color:var(--mute)}
ul.songs .empty{padding:12px 6px;color:var(--mute)}
.tt{display:flex;gap:12px;align-items:center;margin-bottom:10px}.tt img{width:64px;height:64px;object-fit:cover;flex:none;border:2px solid var(--paper)}.tt .by{margin:2px 0 0}
#sart{flex:none;width:46px;height:46px;object-fit:cover;border:2px solid var(--acc-ink)}
#out{display:none;width:min(100%,260px);margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="mark cond">larp my vibe</h1>
  <p class="tagline">A photo in. A song almost nobody posts out.</p>
</header>
<main>
  <section id="stage" aria-label="Your story">
    <div class="frame" id="frame">
      <label class="drop" for="file"><span class="big cond">Drop a photo</span><span class="sm">or tap to choose one. It never leaves your device.</span></label>
      <img id="photo" alt="Your photo">
      <div class="shade"></div>
      <div id="sticker"><i class="disc"></i><img id="sart" alt="" hidden><div><b id="stt"></b><span id="sta"></span></div></div>
      <blockquote id="quote"><p id="qt"></p><cite id="qs"></cite></blockquote>
    </div>
    <div class="pal" id="pal" aria-label="Colours from your photo"></div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="acts">
      <button class="btn" id="chg">Change photo</button>
      <button class="btn pri" id="sv" disabled>Save story</button>
    </div>
    <p class="hint" id="hint">Tap the photo for a new line. Tap a colour to restyle the sticker.</p>
    <img id="out" alt="Your saved story">
  </section>

  <section id="crate" aria-label="Songs">
    <div class="row"><span class="lab">Mood</span><span id="vibes"></span></div>
    <div class="row"><span class="lab">How deep</span><span id="depth"></span></div>
    <div class="row"><span class="lab">Language</span>
      <select id="lang" aria-label="Song language">
        <option value="">Any</option><option value="hindi">Hindi</option><option value="punjabi">Punjabi</option><option value="tamil">Tamil</option><option value="telugu">Telugu</option><option value="malayalam">Malayalam</option><option value="bengali">Bengali</option><option value="japanese">Japanese</option><option value="korean">Korean</option><option value="spanish">Spanish</option><option value="portuguese">Portuguese</option><option value="french">French</option><option value="arabic">Arabic</option><option value="turkish">Turkish</option><option value="italian">Italian</option><option value="instrumental">Instrumental</option>
      </select>
    </div>

    <div id="dock">
      <div class="pw" id="pw"><div id="ytp"></div></div>
      <div class="inf">
        <div class="tt"><img id="art" alt="" hidden><div><h3 class="cond" id="pt"></h3><p class="by" id="pa"></p></div></div>
        <input type="range" id="rg" min="0" max="100" value="0" aria-label="Where your clip starts" disabled>
        <div class="rt"><span>0:00</span><b id="rc"></b><span id="re"></span></div>
        <div class="rowb"><span id="lens"></span><button class="btn pri" id="pp" disabled>Pause</button><button class="btn" id="heart">Stash</button><button class="btn" id="next">Next</button></div>
        <p class="msg" id="msg"></p>
      </div>
    </div>

    <div class="lh"><h2 class="cond">The crate</h2><button class="btn" id="dig">Dig again</button></div>
    <ul class="songs" id="list"></ul>

    <div id="stashw" hidden>
      <div class="lh"><h2 class="cond">Your stash</h2></div>
      <ul class="songs" id="stash"></ul>
    </div>
  </section>
</main>

<script>
const API='https://larp-api.anaghpandey13.workers.dev',ON=/^https?:/.test(API);
const $=id=>document.getElementById(id);
const VIBES={night:'After dark',golden:'Golden hour',moody:'Moody',fresh:'Fresh air',hype:'Loud',retro:'Retro',dreamy:'Dreamy',cinematic:'Cinematic'};
const DEPTHS=['Common','Deep cut','Basement'];

// Starter crate, used only when the backend is off. Each line is Title~Artist.
const SEED={
night:['Galactic Melt~Com Truise','Sentient~Perturbator','Turbo Killer~Carpenter Brut','Running in the Night~FM-84','Tech Noir~GUNSHIP'],
golden:['Maria También~Khruangbin','Show Me How~Men I Trust','Skiptracing~Mild High Club','Archie, Marry Me~Alvvays','Nakamarra~Hiatus Kaiyote'],
moody:['Inside Out~Duster','Heaven or Las Vegas~Cocteau Twins','When the Sun Hits~Slowdive','Pink Moon~Nick Drake','Katy Song~Red House Painters'],
fresh:['Go Outside~Cults','Chinatown~Wild Nothing','Sleep Apnea~Beach Fossils','Catamaran~Allah-Las','Freaks~Surf Curse'],
hype:['Get Got~Death Grips','Zodiac Shit~Flying Lotus','Doorman~slowthai','Nanchaku~Seedhe Maut','Ain’t It Funny~Danny Brown'],
retro:['Sparkle~Tatsuro Yamashita','Remember Summer Days~Anri','Say Goodbye~Hiroshi Sato','Telephone Number~Junko Ohashi','Plastic Love~Mariya Takeuchi'],
dreamy:['Dreams Tonite~Alvvays','Thursday~Asobi Seksu','Tugboat~Galaxie 500','Alison~Slowdive','Pearly-Dewdrops’ Drops~Cocteau Twins'],
cinematic:['Hoppípolla~Sigur Rós','Your Hand in Mine~Explosions in the Sky','Auto Rock~Mogwai','Says~Nils Frahm','On the Nature of Daylight~Max Richter']
};

// Lines are real quotes from films, shows, books and people. Each is text|source.
const Q={
night:['All those moments will be lost in time, like tears in rain.|Blade Runner, 1982','I was within and without, simultaneously enchanted and repelled by the inexhaustible variety of life.|F. Scott Fitzgerald, The Great Gatsby','You talkin’ to me?|Taxi Driver, 1976','It’s only after we’ve lost everything that we’re free to do anything.|Fight Club, 1999','Without music, life would be a mistake.|Friedrich Nietzsche','We are all in the gutter, but some of us are looking at the stars.|Oscar Wilde','Why so serious?|The Dark Knight, 2008'],
moody:['The world breaks everyone, and afterward many are strong at the broken places.|Ernest Hemingway, A Farewell to Arms','So we beat on, boats against the current, borne back ceaselessly into the past.|F. Scott Fitzgerald, The Great Gatsby','A heart’s a heavy burden.|Howl’s Moving Castle, 2004','One must imagine Sisyphus happy.|Albert Camus','Sometimes we forget things if we have no one to tell them to.|The Lunchbox, 2013','Babumoshai, zindagi badi honi chahiye, lambi nahi.|Anand, 1971'],
golden:['Life moves pretty fast.|Ferris Bueller’s Day Off, 1986','In the midst of winter, I found there was, within me, an invincible summer.|Albert Camus','Yesterday is history, tomorrow is a mystery, but today is a gift.|Kung Fu Panda, 2008','Carpe diem. Seize the day, boys.|Dead Poets Society, 1989','Anyone can cook.|Ratatouille, 2007','Main apni favourite hoon.|Jab We Met, 2007'],
fresh:['Bade bade deshon mein aisi chhoti chhoti baatein hoti rehti hain.|Dilwale Dulhania Le Jayenge, 1995','All izz well.|3 Idiots, 2009','Be water, my friend.|Bruce Lee','Tussi ja rahe ho? Tussi na jao.|Kuch Kuch Hota Hai, 1998','Anyone can cook.|Ratatouille, 2007','Life moves pretty fast.|Ferris Bueller’s Day Off, 1986'],
hype:['Float like a butterfly, sting like a bee.|Muhammad Ali','Mogambo khush hua.|Mr. India, 1987','I am the one who knocks.|Breaking Bad','Say my name.|Breaking Bad','By order of the Peaky Blinders.|Peaky Blinders','Kitne aadmi the?|Sholay, 1975','I’m gonna make him an offer he can’t refuse.|The Godfather, 1972','Picture abhi baaki hai mere dost.|Om Shanti Om, 2007'],
retro:['Here’s looking at you, kid.|Casablanca, 1942','Anand mara nahi, Anand marte nahi.|Anand, 1971','Rishte mein toh hum tumhare baap lagte hain, naam hai Shahenshah.|Shahenshah, 1988','Mere paas maa hai.|Deewaar, 1975','Don ko pakadna mushkil hi nahi, namumkin hai.|Don','I’m gonna make him an offer he can’t refuse.|The Godfather, 1972'],
dreamy:['We are such stuff as dreams are made on.|William Shakespeare, The Tempest','Once you’ve met someone, you never really forget them.|Spirited Away, 2001','Love is the one thing that transcends time and space.|Interstellar, 2014','I am rooted, but I flow.|Virginia Woolf, The Waves','Your pain is the breaking of the shell that encloses your understanding.|Kahlil Gibran, The Prophet'],
cinematic:['See you, space cowboy.|Cowboy Bebop','Do or do not. There is no try.|The Empire Strikes Back, 1980','I’ll be back.|The Terminator, 1984','Houston, we have a problem.|Apollo 13, 1995','Life is like a box of chocolates.|Forrest Gump, 1994','All those moments will be lost in time, like tears in rain.|Blade Runner, 1982'],
hi:['Kitne aadmi the?|Sholay, 1975','Mogambo khush hua.|Mr. India, 1987','Main apni favourite hoon.|Jab We Met, 2007','Picture abhi baaki hai mere dost.|Om Shanti Om, 2007','All izz well.|3 Idiots, 2009'],
south:['Naan oru thadava sonna nooru thadava sonna maadhiri.|Baashha, 1995','Pushpa naam sunke flower samjhe kya? Flower nahi, fire hai main.|Pushpa: The Rise, 2021']
};
const QLANG={hindi:'hi',punjabi:'hi',tamil:'south',telugu:'south',malayalam:'south'};

const st={vibe:'moody',depth:1,songs:[],cur:null,img:null,q:null,acc:[255,200,61],win:15,t0:0,dur:0,yp:null,tk:0,fixed:false};
const F=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const same=(a,b)=>a&&b&&a.title===b.title&&a.artist===b.artist;

// ---- reading the photo ----
function analyze(img){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.drawImage(img,0,0,64,64);
  const d=x.getImageData(0,0,64,64).data,n=d.length/4;let R=0,B=0,S=0;const L=[];
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);R+=r;B+=b;S+=mx?(mx-mn)/mx:0;L.push((.299*r+.587*g+.114*b)/255)}
  const lum=L.reduce((a,b)=>a+b,0)/n,sat=S/n,con=Math.sqrt(L.reduce((a,b)=>a+(b-lum)**2,0)/n),warm=(R-B)/n;
  if(lum<.3)return sat>.45&&con>.25?'hype':'night';
  if(sat>.45&&con>.22)return 'hype';
  if(lum>.6&&con<.16)return 'dreamy';
  if(con>.28&&lum<.55)return 'cinematic';
  if(warm>25&&lum>.5)return 'golden';
  if(sat<.28&&warm>8)return 'retro';
  if(lum>.55)return 'fresh';
  return 'moody';
}
function palette(img){
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(img,0,0,48,48);
  const d=x.getImageData(0,0,48,48).data,m={};
  for(let i=0;i<d.length;i+=4){const k=((d[i]>>5)<<6)|((d[i+1]>>5)<<3)|(d[i+2]>>5),o=m[k]||(m[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2]}
  const a=Object.values(m).map(o=>({n:o.n,c:[o.r/o.n,o.g/o.n,o.b/o.n].map(Math.round)})).sort((p,q)=>q.n-p.n),out=[];
  for(const o of a){if(out.every(p=>Math.hypot(p[0]-o.c[0],p[1]-o.c[1],p[2]-o.c[2])>70))out.push(o.c);if(out.length===5)break}
  return out;
}
function setAcc(c){
  st.acc=c;const lum=.299*c[0]+.587*c[1]+.114*c[2],r=document.documentElement.style;
  r.setProperty('--acc','rgb('+c.join(',')+')');r.setProperty('--acc-ink',lum>150?'#0E1535':'#FFFFFF');
  [...$('pal').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c.join(',')));
}
function drawPal(cols){
  const p=$('pal');p.innerHTML='';
  cols.forEach(c=>{const b=document.createElement('button');b.style.background='rgb('+c.join(',')+')';b.dataset.c=c.join(',');b.setAttribute('aria-label','Use this colour');b.onclick=()=>setAcc(c);p.appendChild(b)});
  p.classList.add('on');
  const v=cols.slice().sort((a,b)=>(Math.max(...b)-Math.min(...b))-(Math.max(...a)-Math.min(...a)))[0];setAcc(v||cols[0]);
}

// ---- mood, depth, quotes ----
function tabs(box,items,cur,fn){box.innerHTML='';items.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab';b.textContent=l;b.setAttribute('aria-pressed',String(k)===String(cur));b.onclick=()=>fn(k);box.appendChild(b);box.append(' ')})}
function drawTabs(){
  tabs($('vibes'),Object.entries(VIBES),st.vibe,k=>{st.vibe=k;newQuote();drawTabs();dig()});
  tabs($('depth'),DEPTHS.map((l,i)=>[i,l]),st.depth,i=>{st.depth=+i;drawTabs();dig()});
}
function newQuote(){
  const pool=(Q[st.vibe]||[]).slice(),extra=Q[QLANG[$('lang').value]];
  if(extra&&Math.random()<.5)pool.push(...extra);
  let q;do{q=rnd(pool)}while(q===st.q&&pool.length>1);
  st.q=q;const p=q.split('|'),el=$('quote');$('qt').textContent='“'+p[0]+'”';$('qs').textContent=p[1];
  el.classList.remove('f');void el.offsetWidth;el.classList.add('f');
}

// ---- the crate ----
function row(s,ul,x){
  const li=document.createElement('li'),b=document.createElement('button'),t=document.createElement('span'),a=document.createElement('span');
  b.className='go';t.className='t';t.textContent=s.title;a.className='a';a.textContent=s.artist;b.append(t,a);
  if(same(s,st.cur))b.setAttribute('aria-current','true');
  b.onclick=()=>play(s);li.appendChild(b);
  if(x){const r=document.createElement('button');r.className='x';r.textContent='Remove';r.setAttribute('aria-label','Remove from stash');r.onclick=()=>{ls.set('larp_stash',ls.get('larp_stash',[]).filter(o=>!same(o,s)));drawStash();heart()};li.appendChild(r)}
  ul.appendChild(li);
}
function drawList(msg){
  if(msg===undefined)msg=st.note;
  const ul=$('list');ul.innerHTML='';
  if(msg){const m=document.createElement('li');m.className='empty';m.textContent=msg;ul.appendChild(m)}
  st.songs.forEach(s=>row(s,ul));
}
function drawStash(){
  const a=ls.get('larp_stash',[]);$('stashw').hidden=!a.length;const ul=$('stash');ul.innerHTML='';a.forEach(s=>row(s,ul,true));
}
async function dig(){
  st.songs=[];drawList('Digging…');
  let songs=[],msg='';
  if(ON){
    try{const d=await(await fetch(API+'/songs?vibe='+st.vibe+'&depth='+st.depth+'&lang='+encodeURIComponent($('lang').value))).json();songs=d.songs||[];if(d.error)msg=d.error}
    catch(e){msg='Couldn’t reach the song service.'}
  }
  if(!songs.length){songs=(SEED[st.vibe]||[]).map(s=>{const p=s.split('~');return{title:p[0],artist:p[1]}});
    msg=ON?'Showing a starter crate instead. '+msg:'Showing a starter crate. Connect the song service for endless digging.'}
  st.songs=songs;st.note=msg;drawList();
}

// ---- cover art ----
function jsonp(u){return new Promise((ok,no)=>{const f='cb'+Date.now()+Math.floor(Math.random()*1e4),el=document.createElement('script'),t=setTimeout(()=>{cl();no(new Error('timed out'))},7000);
  function cl(){clearTimeout(t);delete window[f];el.remove()}
  window[f]=d=>{cl();ok(d)};el.onerror=()=>{cl();no(new Error('blocked'))};el.src=u+'&callback='+f;document.head.appendChild(el)})}
function setArt(u){
  st.art=u||'';st.artImg=null;const a=$('art'),b=$('sart'),d=document.querySelector('#sticker .disc');
  a.hidden=b.hidden=!u;d.style.display=u?'none':'';
  if(u){a.src=b.src=u;const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{st.artImg=im};im.src=u}
}
async function findArt(s,id){
  setArt(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'');
  try{
    const d=await jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=3&term='+encodeURIComponent(s.artist+' '+s.title));
    const n=v=>(v||'').toLowerCase(),a=n(s.artist).slice(0,6);
    const r=(d.results||[]).find(o=>n(o.artistName).includes(a)||(a&&n(s.artist).includes(n(o.artistName).slice(0,6))));
    if(r&&r.artworkUrl100&&st.cur===s)setArt(r.artworkUrl100.replace(/\d+x\d+bb/,'400x400bb'));
  }catch(e){}
}

// ---- playing a song and choosing the clip ----
const vc=ls.get('larp_vc',{});
function loadYT(){return new Promise((ok,no)=>{if(window.YT&&YT.Player)return ok();const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>no(new Error('YouTube is blocked on this network'));window.onYouTubeIframeAPIReady=ok;document.head.appendChild(s);setTimeout(()=>no(new Error('YouTube timed out')),8000)})}
function fallback(s,why){
  const m=$('msg');m.textContent=why+' ';const a=document.createElement('a'),q=encodeURIComponent(s.artist+' '+s.title);
  a.href='https://www.youtube.com/results?search_query='+q;a.target='_blank';a.rel='noopener';a.textContent='Open on YouTube';m.appendChild(a);
}
function sticker(){
  const s=st.cur;if(!s)return;$('stt').textContent=s.title;
  $('sta').textContent=s.artist+(st.dur?'  '+F(st.t0)+' to '+F(st.t0+st.win):'');$('sticker').style.display=st.img?'flex':'none';
}
async function play(s){
  st.cur=s;st.dur=0;st.fixed=false;document.body.classList.remove('playing');setArt('');$('pp').disabled=true;$('pp').textContent='Pause';
  $('dock').classList.add('on');$('pt').textContent=s.title;$('pa').textContent=s.artist;$('rg').disabled=true;$('rc').textContent='';$('re').textContent='';
  $('msg').textContent=ON?'Loading…':'';sticker();heart();drawList();drawStash();
  if(matchMedia('(max-width:879px)').matches)$('dock').scrollIntoView({behavior:'smooth',block:'start'});
  if(!ON){findArt(s,null);fallback(s,'Playback needs the song service.');return}
  try{
    const k=s.artist+'|'+s.title;let id=vc[k];
    if(!id){const d=await(await fetch(API+'/resolve?title='+encodeURIComponent(s.title)+'&artist='+encodeURIComponent(s.artist))).json();id=d.videoId;
      if(id){vc[k]=id;ls.set('larp_vc',vc)}else if(d.error)throw new Error(/quota/i.test(d.error)?'Today’s song lookups are used up.':d.error)}
    if(!id)throw new Error('No playable copy found.');
    if(st.cur!==s)return;
    findArt(s,id);
    await loadYT();
    if(st.yp&&st.yp.loadVideoById)st.yp.loadVideoById({videoId:id,startSeconds:0});
    else st.yp=new YT.Player('ytp',{width:'200',height:'200',videoId:id,playerVars:{playsinline:1},events:{onReady:e=>e.target.playVideo(),onStateChange:e=>{document.body.classList.toggle('playing',e.data===1);if(e.data===1||e.data===2){$('pp').disabled=false;$('pp').textContent=e.data===1?'Pause':'Play'}if(e.data===1)ready()}}});
    clearInterval(st.tk);st.tk=setInterval(()=>{try{if(st.dur&&st.yp.getCurrentTime()>=st.t0+st.win)st.yp.seekTo(st.t0,true)}catch(e){}},300);
    $('msg').textContent='';
  }catch(e){fallback(s,(e.message||e)+'')}
}
function ready(){
  if(st.fixed||!st.yp.getDuration)return;const d=Math.round(st.yp.getDuration());if(d<20)return;
  st.fixed=true;st.dur=d;$('rg').disabled=false;$('re').textContent=F(d);
  const saved=ls.get('larp_stash',[]).find(o=>same(o,st.cur));
  clip(saved&&saved.t0!=null?saved.t0:Math.round(d*.3),true);
}
function clip(t,go){
  if(!st.dur)return;st.t0=Math.max(0,Math.min(t,st.dur-st.win));
  $('rg').max=st.dur-st.win;$('rg').value=st.t0;$('rc').textContent=F(st.t0)+' to '+F(st.t0+st.win);
  tabs($('lens'),[5,10,15].map(n=>[n,n+' sec']),st.win,n=>{st.win=+n;clip(st.t0,true)});
  sticker();
  const a=ls.get('larp_stash',[]),m=a.find(o=>same(o,st.cur));if(m){m.t0=st.t0;ls.set('larp_stash',a)}
  if(go){clearTimeout(st.db);st.db=setTimeout(()=>{try{st.yp.seekTo(st.t0,true);st.yp.playVideo()}catch(e){}},160)}
}
$('rg').oninput=e=>clip(+e.target.value,true);
function heart(){const on=ls.get('larp_stash',[]).some(o=>same(o,st.cur));$('heart').textContent=on?'Stashed':'Stash';$('heart').setAttribute('aria-pressed',on)}
$('heart').onclick=()=>{
  if(!st.cur)return;let a=ls.get('larp_stash',[]);
  a=a.some(o=>same(o,st.cur))?a.filter(o=>!same(o,st.cur)):[{title:st.cur.title,artist:st.cur.artist,t0:st.dur?st.t0:null},...a].slice(0,40);
  ls.set('larp_stash',a);heart();drawStash();
};
function step(d){const L=st.songs;if(!L.length)return;let i=L.findIndex(s=>same(s,st.cur));i=i<0?0:(i+d+L.length)%L.length;play(L[i])}
$('next').onclick=()=>step(1);
$('pp').onclick=()=>{const y=st.yp;if(!y||!y.getPlayerState)return;y.getPlayerState()===1?y.pauseVideo():y.playVideo()};
document.addEventListener('keydown',e=>{if(e.key===' '&&e.target===document.body&&!$('pp').disabled){e.preventDefault();$('pp').click();return}if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

// ---- photo in ----
function handle(f){
  if(!f||!f.type.startsWith('image/'))return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    st.img=im;$('photo').src=url;$('frame').classList.add('on');$('hint').classList.add('on');$('sv').disabled=false;
    st.vibe=analyze(im);drawTabs();newQuote();drawPal(palette(im));sticker();dig();
  };
  im.src=url;
}
$('file').onchange=e=>handle(e.target.files[0]);
$('chg').onclick=()=>$('file').click();
$('frame').addEventListener('click',e=>{if(st.img&&!e.target.closest('label'))newQuote()});
$('dig').onclick=dig;
$('lang').onchange=()=>{if(st.img)newQuote();dig()};
['dragover','dragenter'].forEach(t=>$('frame').addEventListener(t,e=>e.preventDefault()));
$('frame').addEventListener('drop',e=>{e.preventDefault();handle(e.dataTransfer.files[0])});

// ---- save the story as an image ----
function wrap(x,t,w){const o=[];let l='';t.split(' ').forEach(wd=>{const n=l?l+' '+wd:wd;if(x.measureText(n).width>w&&l){o.push(l);l=wd}else l=n});o.push(l);return o}
async function save(){
  if(!st.img)return;try{await document.fonts.ready}catch(e){}
  const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d'),im=st.img,r=Math.max(1080/im.width,1920/im.height);
  const acc='rgb('+st.acc.join(',')+')',lum=.299*st.acc[0]+.587*st.acc[1]+.114*st.acc[2],ink=lum>150?'#0E1535':'#FFFFFF';
  x.drawImage(im,(1080-im.width*r)/2,(1920-im.height*r)/2,im.width*r,im.height*r);
  const g=x.createLinearGradient(0,900,0,1920);g.addColorStop(0,'rgba(10,14,40,0)');g.addColorStop(1,'rgba(10,14,40,.9)');x.fillStyle=g;x.fillRect(0,900,1080,1020);
  const p=st.q.split('|');x.fillStyle='#fff';x.font='italic 400 68px Newsreader, Georgia, serif';x.textBaseline='alphabetic';
  const L=wrap(x,'“'+p[0]+'”',900),y0=1790-L.length*86;L.forEach((l,i)=>x.fillText(l,90,y0+i*86));
  x.fillStyle=acc;x.font='600 34px Archivo, sans-serif';x.fillText(p[1],90,1850);
  const s=st.cur;
  if(s){const h=st.dur?170:140,A=st.artImg&&st.artImg.naturalWidth?st.artImg:null,tx=A?h+24:28;
    x.save();x.translate(70,150);x.rotate(-.05);x.fillStyle=acc;x.fillRect(0,0,740,h);
    if(A){const k=Math.min(A.naturalWidth,A.naturalHeight);x.drawImage(A,(A.naturalWidth-k)/2,(A.naturalHeight-k)/2,k,k,0,0,h,h)}
    x.fillStyle=ink;x.font='800 46px Archivo, sans-serif';x.fillText(s.title.slice(0,A?24:30),tx,62);x.font='400 32px Archivo, sans-serif';
    x.fillText(s.artist.slice(0,A?28:36),tx,110);if(st.dur){x.font='600 30px Archivo, sans-serif';x.fillText(F(st.t0)+' to '+F(st.t0+st.win),tx,152)}x.restore()}
  c.toBlob(b=>{const u=URL.createObjectURL(b);$('out').src=u;$('out').style.display='block';const a=document.createElement('a');a.href=u;a.download='larp-my-vibe.png';a.click()},'image/png');
}
$('sv').onclick=save;
drawTabs();drawStash();
</script>
